{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: url("{% static 'images/bg.jpg' %}") no-repeat center center/cover;
            font-family: Arial, sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
            color: #555;
        }

        a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">
    <h2> Email Sent!</h2>
    <p>Check your inbox for the password reset link.</p>

    <a href="{% url 'login' %}">Back to Login</a>
</div>

</body>
</html>
