{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /*Your background image */
            background: url("{% static 'images/bg.jpg' %}") no-repeat center center/cover;
            font-family: Arial, sans-serif;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 10px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Forgot Password</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}">Back to Login</a>
</div>

</body>
</html>
