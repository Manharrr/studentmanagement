{% extends 'base.html' %}
{% block layout_wrapper %}
<div class="auth-wrapper" style="background-image: url('/static/images/background_img.jpg')">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="auth-title">Set New Password</h2>
        </div>
        <form method="POST">
            {% csrf_token %}
            <div class="custom-input-group">
                <input type="password" name="new_password1" placeholder="New Password" required>
                <i class="fas fa-lock"></i>
            </div>
            <div class="custom-input-group">
                <input type="password" name="new_password2" placeholder="Confirm Password" required>
                <i class="fas fa-lock"></i>
            </div>
            {% if form.errors %}
            <div class="alert alert-danger small">{{ form.errors }}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary-custom">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
